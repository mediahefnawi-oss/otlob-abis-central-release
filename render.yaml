services:
  - type: web
    name: otlob-abis-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_USERNAME
        value: adminhefnawi
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_PHONE
        value: 01000000000
      - key: CORS_ORIGINS
        sync: false
